# Site settings
title: Impacto social de la Inteligencia Artificial
description: Explorando la inteligencia artificial, sus fundamentos, desafíos éticos y sociales.
baseurl: /impacto_ai # The subpath of your site, e.g. /blog
url: "https://arnulfoperez.github.io" # The base hostname & protocol for your site, e.g. http://example.com
repository: "ArnulfoPerez/impacto_ai" # Good to have for GitHub Pages setup

# Build settings
theme: minima
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM # GitHub Flavored Markdown
  hard_wrap: false
  syntax_highlighter_opts:
    block:
      line_numbers: false
  math_engine: mathjax

# Plugins (keeping only necessary ones for now)
plugins:
  - jekyll-feed
  - jekyll-seo-tag # Re-enabled, it's generally useful for SEO

# Navigation variables for your menu
navigation:
  - title: "Inicio"
    url: "/"
  - title: "Sesiones"
    url: "/sesiones/" # This will be the new main sessions listing page
  - title: "Presentaciones"
    url: "/presentaciones/"
  - title: "Actividades"
    url: "/actividades/"
  - title: "Glosario"
    url: "/glosario/"
  - title: "Lecturas"
    url: "/lecturas/"
  - title: "Instructor"
    url: "/instructor/"

# Instructor info
instructor:
  name: "Dr. Arnulfo Pérez"
  email: "arnulfo.perez@zintegra.com"
  linkedin: "https://www.linkedin.com/in/arnulfoperez/"
  position: "Consultor"
  institution: "Zintegra"

# Course and general objectives
course:
  objectives:
    - "Comprender la evolución de la IA y diferenciar sus etapas."
    - "Identificar las funciones de la IA moderna y sus aplicaciones prácticas diarias."
    - "Analizar críticamente cómo la IA es representada en la cultura (cine, literatura)."
    - "Evaluar el impacto social, laboral, ético y ambiental de la IA."
    - "Participar informadamente en debates y decisiones sobre el uso y la regulación de la IA."

# Custom collections
collections:
  sessions:
    output: true
    permalink: /:block/:slug/ # This still requires 'block' in session front matter

# Custom collections
collections:
  sessions:
    output: true
    permalink: /:block/:slug/ # This still requires 'block' in session front matter

# Default layouts and permalinks
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "_sessions"
      type: "sessions"
    values:
      layout: "session"

# Metadata for Blocks (crucial for dynamic listing and sorting)
blocks_metadata:
  inteligencia:
    title: "Inteligencia desde las perspectivas evolutiva, cognitiva, y computacional"
    description: "La inteligencia se analiza desde tres ejes fundamentales..."
    icon: "🧠"
    order: 1 # <--- ADDED: Required for sorting in index.md/bloques.md
  infraestructura:
    title: "La Inteligencia Artificial y su infraestructura"
    description: "En esencia, la IA moderna 'aprende' mediante redes neuronales..."
    icon: "🌐"
    order: 2 # <--- ADDED: Required for sorting
  impacto:
    title: "El impacto socioeconómico de la Inteligencia Artificial"
    description: "La IA contemporánea plantea paradojas sistémicas..."
    icon: "⚖️"
    order: 3 # <--- ADDED: Required for sorting
  percepcion:
    title: "La percepción sociocultural de la Inteligencia Artificial (IA) y sus tendencias futuras"
    description: "El análisis de películas, literatura y marketing tecnológico revela..."
    icon: "🎭"
    order: 4 # <--- ADDED: Required for sorting

# Metadata for Sessions (useful for display, but session files are primary data source)
session_metadata:
  inteligencia:
    intro:
      title: "Introducción"
      obj: ["Definir inteligencia", "Historia evolutiva"]
      description: "Exploración del concepto de inteligencia desde la neurociencia..."
    fundamentos:
      title: "Fundamentos conceptuales e historia de la inteligencia artificial (IA)"
      obj: ["Tipos de redes neuronales", "Backpropagation"]
      description: "Esta sesión explorará los pilares fundamentales de la inteligencia artificial..."
  infraestructura:
    modelos:
      title: "Modelos, datos y entrenamiento"
      obj: ["Diferenciar los principales enfoques de modelos de IA", "Comprender el proceso de entrenamiento de modelos"]
      description: "Esta sesión abordará los fundamentos sistémicos de la inteligencia artificial..."
    infraestructura:
      title: "Infraestructura de IA"
      obj: ["Identificar los componentes clave de la infraestructura de IA", "Evaluar el impacto ambiental de la IA"]
      description: "El desarrollo de la IA depende de una infraestructura masiva con costos ocultos..."
  impacto:
    individual:
      title: "Impacto individual de la IA, oportunidades y riesgos"
      obj: ["Reconocer los efectos de la IA en la vida diaria", "Evaluar riesgos clave en interacciones digitales"]
      description: "Esta sesión explorará cómo la inteligencia artificial está transformando la vida cotidiana..."
    institucional:
      title: "IA en las organizaciones: Estrategias empresariales"
      obj: ["Identificar los componentes clave para una implementación responsable de IA", "Diseñar políticas de gobernanza para IA"]
      description: "Esta sesión está diseñada para profesionales y tomadores de decisiones..."
  percepcion:
    sociocultural:
      title: "La percepción sociocultural de la IA"
      obj: ["Deconstruir narrativas dominantes sobre IA", "Evaluar el impacto sociocultural de estas representaciones"]
      description: "La representación de la IA en películas, literatura y marketing tecnológico..."
    cierre:
      title: "El impacto socioeconómico de la IA"
      obj: ["Integrar conocimientos transversales", "Evaluar tensiones clave", "Proponer acciones aplicables", "Reflexionar sobre tendencias futuras"]
      description: "Esta sesión integra los ejes clave del curso, desde los fundamentos técnicos..."
